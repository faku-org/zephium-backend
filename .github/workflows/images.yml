name: Build deployment images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  verify:
    uses: ./.github/workflows/check.yml
  images:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: container-release
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Authenticate registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish exact revision
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          repository="ghcr.io/${REPOSITORY,,}"
          for target in account worker; do
            image="$repository/$target:$GITHUB_SHA-$GITHUB_RUN_ID"
            docker build --build-arg "SOURCE_URL=https://github.com/$REPOSITORY/tree/$GITHUB_SHA" --target "$target" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image" .
            docker push "$image"
            docker inspect --format='{{index .RepoDigests 0}}' "$image" >> "$GITHUB_STEP_SUMMARY"
          done

          image="$repository/postgres:$GITHUB_SHA-$GITHUB_RUN_ID"
          docker build -f deploy/postgres/Dockerfile --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image" .
          docker push "$image"
          docker inspect --format='{{index .RepoDigests 0}}' "$image" >> "$GITHUB_STEP_SUMMARY"
