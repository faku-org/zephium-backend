services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: zephium
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: zephium
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zephium -d zephium"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
